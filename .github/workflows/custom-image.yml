name: custom image

# Builds the latest Calibre-Web-Automated release with the patch branches of
# this fork applied on top, and pushes it to GHCR. If a patch no longer applies
# or the unit tests fail, nothing is published (GitHub e-mails the failure).

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this release + patches is already published
        type: boolean
        default: false

permissions:
  contents: write   # record the last build on this branch
  packages: write

env:
  UPSTREAM: crocodilestick/Calibre-Web-Automated
  IMAGE: ghcr.io/${{ github.repository_owner }}/calibre-web-automated
  # Space-separated branches of this fork whose commits are applied on top of the release
  PATCH_BRANCHES: feat/amazon-store-region

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Latest upstream release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Upstream release: $tag"

      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.up.outputs.tag }}
          fetch-depth: 0
          path: src

      - name: Apply patch branches
        id: patch
        working-directory: src
        run: |
          git config user.name "custom-build"
          git config user.email "custom-build@users.noreply.github.com"
          git fetch -q origin main
          git remote add fork "https://github.com/${{ github.repository }}.git"
          applied=""
          for branch in $PATCH_BRANCHES; do
            git fetch -q fork "$branch"
            # commits of the branch that upstream main does not contain yet ("+" lines)
            for c in $(git cherry origin/main FETCH_HEAD | awk '$1 == "+" {print $2}'); do
              if git merge-base --is-ancestor "$c" HEAD; then continue; fi
              echo "Applying $branch $(git log -1 --format='%h %s' "$c")"
              if ! git cherry-pick --keep-redundant-commits "$c"; then
                git cherry-pick --abort || true
                echo "::error::$branch commit $c does not apply on ${{ steps.up.outputs.tag }} - update the branch"
                exit 1
              fi
              applied="$applied $(git rev-parse --short "$c")"
            done
          done
          [ -n "$applied" ] || echo "No patches left to apply (already upstream?)"
          id=$(echo "${{ steps.up.outputs.tag }}$applied" | sha1sum | cut -c1-7)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "applied=${applied# }" >> "$GITHUB_OUTPUT"

      - name: Skip if already published
        id: check
        run: |
          if [ "${{ inputs.force }}" != "true" ] \
             && docker manifest inspect "$IMAGE:${{ steps.up.outputs.tag }}-${{ steps.patch.outputs.id }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already built"
          fi

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/requirements*.txt

      - name: Unit tests (same as upstream "Fast Tests")
        if: steps.check.outputs.skip != 'true'
        working-directory: src
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/scripts
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libldap2-dev libsasl2-dev libssl-dev
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt -r requirements-dev.txt
          sudo mkdir -p /config /books/import /books/ingest /config/processed_books
          sudo chmod -R 777 /config /books
          touch /config/epub-fixer.log /config/converter.log /config/cwa.db
          pytest -m "smoke or unit" -n auto --maxfail=3 -q --tb=short -p no:cacheprovider

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: src
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ steps.up.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.up.outputs.tag }}-${{ steps.patch.outputs.id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Calibre-Web-Automated ${{ steps.up.outputs.tag }} with patches: ${{ steps.patch.outputs.applied }}

      - name: Record build
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone -q --depth 1 -b "${GITHUB_REF_NAME}" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rec
          cd rec
          printf '%s %s-%s patches: %s\n' "$(date -u +%F)" "${{ steps.up.outputs.tag }}" "${{ steps.patch.outputs.id }}" "${{ steps.patch.outputs.applied }}" >> BUILDS.txt
          git config user.name "custom-build"
          git config user.email "custom-build@users.noreply.github.com"
          git add BUILDS.txt && git commit -q -m "build ${{ steps.up.outputs.tag }}-${{ steps.patch.outputs.id }}" && git push -q
